data:
  dataset_name: chapter544ou/vietnamese_students_feedback
  max_length: 50
  max_features: 1000
  max_Features: 1000
  val_split_ratio: 0.2
  min_freq: 2

models:
  model_name: ann
  ann:
    input_dim: 1000
    hidden_dims: [512, 256]
    output_dim: 3
    dropout: 0.2

training:
  epochs: 10
  batch_size: 32
  learning_rate: 0.001
  weight_decay: 0.0
  seed: 42
  device: auto
