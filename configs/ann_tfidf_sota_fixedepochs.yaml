data:
  dataset_name: chapter544ou/vietnamese_students_feedback
  max_length: 50
  max_features: 1000
  max_Features: 1000
  min_freq: 2

models:
  model_name: ann
  ann:
    input_dim: 1000
    hidden_dims: [256, 128]
    output_dim: 3
    dropout: 0.3

training:
  epochs: 50 
  early_stopping:
    enabled: true
    patience: 6
    min_delta: 0.0001
    fluctuation_delta: 0.01
  batch_size: 32
  learning_rate: 0.0001
  embedding_learning_rate: 0.00001
  class_weights: [0.674, 5.000, 0.715]
  weight_decay: 0.001
  seed: 42
  device: auto

logging:
  enabled: false

tracking:
  mlflow:
    experiment_name: vsfc_lstm_baseline
    run_name: lstm_w2vec_unfrozen_split_lr
    tracking_uri: file:./mlruns