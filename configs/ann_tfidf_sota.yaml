data:
  dataset_name: chapter544ou/vietnamese_students_feedback
  max_length: 50
  max_features: 1000
  max_Features: 1000
  min_freq: 2

models:
  model_name: ann
  ann:
    input_dim: 1000
    hidden_dims: [256, 128]
    output_dim: 3
    dropout: 0.3

training:
  epochs: 10
  batch_size: 32
  learning_rate: 0.0001
  class_weights: [0.674, 5.000, 0.715]
  weight_decay: 0.001
  seed: 42
  device: auto

logging:
  enabled: false

tracking:
  mlflow:
    experiment_name: vsfc_ann_baseline
    run_name: ann_tfidf_baseline
    tracking_uri: file:./mlruns